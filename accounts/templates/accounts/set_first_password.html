<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Set Password | DejaBrew Payroll</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial, sans-serif;
    }

    body{
      background:#d8cec8;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .card{
      width:100%;
      max-width:380px;
      background:#fffaf7;
      padding:32px 28px;
      border-radius:20px;
      box-shadow:0 14px 35px rgba(0,0,0,.12);
    }

    h2{
      font-size:26px;
      margin-bottom:6px;
      color:#2f2f2f;
    }

    .subtitle{
      font-size:14px;
      color:#6b6b6b;
      margin-bottom:22px;
      line-height:1.4;
    }

    .message-box{
      background:#e7f6ea;
      color:#1f6b35;
      border:1px solid #b7dfbf;
      padding:12px;
      border-radius:10px;
      margin-bottom:14px;
      font-size:13px;
    }

    .form-group{
      margin-bottom:16px;
    }

    .form-group label{
      display:block;
      margin-bottom:6px;
      font-size:13px;
      font-weight:bold;
      color:#333;
    }

    .form-group input{
      width:100%;
      padding:12px 14px;
      border:1px solid #d8ccc6;
      border-radius:10px;
      font-size:14px;
      outline:none;
      transition:.2s ease;
    }

    .form-group input:focus{
      border-color:#b49787;
      box-shadow:0 0 0 3px rgba(180,151,135,.15);
    }

    .show-password{
      display:flex;
      align-items:center;
      gap:8px;
      margin-top:-8px;
      margin-bottom:16px;
      font-size:13px;
      color:#555;
    }

    .show-password input{
      accent-color:#b49787;
    }

    .btn{
      width:100%;
      padding:13px;
      border:none;
      border-radius:10px;
      background:#b49787;
      color:white;
      font-size:15px;
      font-weight:bold;
      cursor:pointer;
      transition:.2s ease;
    }

    .btn:hover{
      background:#9f8475;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Set Your Password</h2>
    <p class="subtitle">
      Hello, {{ employee.name }}. Please set your password before continuing.
    </p>

    {% for message in messages %}
      <div class="message-box">{{ message }}</div>
    {% endfor %}

    <form method="post">
      {% csrf_token %}

      <div class="form-group">
        <label>New Password</label>
        <input type="password" name="new_password" id="new_password" maxlength="255" required>
      </div>

      <div class="show-password">
        <input type="checkbox" id="showNewPassword">
        <label for="showNewPassword">Show new password</label>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" id="confirm_password" maxlength="255" required>
      </div>

      <div class="show-password">
        <input type="checkbox" id="showConfirmPassword">
        <label for="showConfirmPassword">Show confirm password</label>
      </div>

      <button type="submit" class="btn">Save Password</button>
    </form>
  </div>

  <script>
    const showNewPassword = document.getElementById("showNewPassword");
    const showConfirmPassword = document.getElementById("showConfirmPassword");

    const newPassword = document.getElementById("new_password");
    const confirmPassword = document.getElementById("confirm_password");

    showNewPassword.addEventListener("change", function(){
      newPassword.type = this.checked ? "text" : "password";
    });

    showConfirmPassword.addEventListener("change", function(){
      confirmPassword.type = this.checked ? "text" : "password";
    });
  </script>
</body>
</html>
