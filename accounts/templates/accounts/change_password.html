{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | DejaBrew Payroll</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #d8cec8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 380px;
            background: #fffaf7;
            padding: 32px 28px;
            border-radius: 20px;
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.12);
        }

        h2 {
            font-size: 26px;
            margin-bottom: 6px;
            color: #2f2f2f;
        }

        .subtitle {
            font-size: 14px;
            color: #6b6b6b;
            margin-bottom: 22px;
        }

        .error-box {
            background: #ffe3e3;
            color: #a12626;
            border: 1px solid #f1b6b6;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 14px;
            font-size: 13px;
        }

        .success-box {
            background: #e7f6ea;
            color: #1f6b35;
            border: 1px solid #b7dfbf;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 14px;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: bold;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d8ccc6;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: 0.2s ease;
        }

        .form-group input:focus {
            border-color: #b49787;
            box-shadow: 0 0 0 3px rgba(180, 151, 135, 0.15);
        }

        .show-password {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            font-size: 13px;
            color: #555;
        }

        .show-password input {
            accent-color: #b49787;
        }

        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #b49787;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .cancel-btn {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 13px;
            text-align: center;
            border-radius: 10px;
            background: transparent;
            border: 1px solid #b49787;
            color: #6b5b52;
            font-size: 15px;
            text-decoration: none;
            transition: 0.2s ease;
        }

        .cancel-btn:hover {
            background: #f1e8e3;
        }

        .btn:hover {
            background: #9f8475;
        }

        .footer {
            margin-top: 14px;
            font-size: 12px;
            color: #777;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Change Password</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="success-box">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% if error %}
            <div class="error-box">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Current Password</label>
                <input type="password" name="old_pw" id="old_pw" required maxlength="255">
            </div>

            <div class="show-password">
                <input type="checkbox" id="showOldPassword">
                <label for="showOldPassword">Show current password</label>
            </div>

            <div class="form-group">
                <label>New Password</label>
                <input type="password" name="new_pw1" id="new_pw1" required maxlength="255">
            </div>

            <div class="show-password">
                <input type="checkbox" id="showNewPassword">
                <label for="showNewPassword">Show new password</label>
            </div>

            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" name="new_pw2" id="new_pw2" required maxlength="255">
            </div>

            <div class="show-password">
                <input type="checkbox" id="showConfirmPassword">
                <label for="showConfirmPassword">Show confirm password</label>
            </div>

            <button type="submit" class="btn">Save Changes</button>

            <a href="{% url 'post_login' %}" class="cancel-btn">Cancel</a>
        </form>

    </div>

    <script>
        const toggle = document.getElementById("showPasswords");
        const fields = [
            document.getElementById("old_pw"),
            document.getElementById("new_pw1"),
            document.getElementById("new_pw2")
        ];

        toggle.addEventListener("change", function () {
            const type = this.checked ? "text" : "password";
            fields.forEach(f => f.type = type);
        });
    </script>
</body>
</html>
