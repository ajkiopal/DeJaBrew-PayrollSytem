{% extends "base_staff.html" %}
{% block title %}Staff Scheduling{% endblock %}
{% block nav_schedule_active %}active{% endblock %}

{% block content %}
<div class="content-card p-4 mt-4">
  <h2 class="mb-3">Shift Schedule</h2>
  <div id="calendar"></div>
</div>

<div class="overlay" id="detailOverlay">
  <div class="modal">
    <div class="mhead">
      <div class="mtitle">Schedule Details</div>
      <button class="close" type="button" id="closeDetailBtn">×</button>
    </div>

    <div class="divider"></div>

    <div class="grid">
      <div class="field full"><span class="detail-label">Title</span><div class="detail-box" id="detailTitle"></div></div>
      <div class="field full"><span class="detail-label">Date</span><div class="detail-box" id="detailDate"></div></div>
      <div class="field"><span class="detail-label">Start Time</span><div class="detail-box" id="detailStartTime"></div></div>
      <div class="field"><span class="detail-label">End Time</span><div class="detail-box" id="detailEndTime"></div></div>
      <div class="field full"><span class="detail-label">Assigned Employees</span><div class="detail-box" id="detailEmployees"></div></div>
      <div class="field full"><span class="detail-label">Description</span><div class="detail-box description-box" id="detailDescription"></div></div>
    </div>

    <div class="actions">
      <button class="btnDark" type="button" id="closeDetailBottomBtn">Close</button>
    </div>
  </div>
</div>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<style>
:root{
  --brown:#cbb6a8; --brownDark:#8f7668; --cream:#fffdfb; --hover:#f4eee9;
  --shadow:0 10px 28px rgba(0,0,0,.10); --modalBg:#d9d2ce;
  --inputBg:#f4f1ef; --inputBorder:#e3dbd7; --muted:#7a7a7a; --danger:#ff0000;
}
#calendar{background:#fff;padding:20px;border-radius:22px;box-shadow:var(--shadow)}
.fc .fc-toolbar-title{font-size:24px;font-weight:700;color:#3b2f2f}
.fc .fc-button{background:var(--brown);border:none;color:#000;border-radius:999px;padding:8px 14px;font-weight:600}
.fc .fc-button:hover{background:#b89f8f}
.fc .fc-button-primary:not(:disabled).fc-button-active{background:var(--brownDark);color:#fff}
.fc .fc-daygrid-day{background:var(--cream)}
.fc .fc-daygrid-day:hover{background:var(--hover)}
.fc .fc-day-today{background:#fff9ee!important}
.fc .fc-event{background:#a88f80;border:none;border-radius:10px;padding:4px 6px;font-size:13px;cursor:pointer;color:#fff!important}
.fc-daygrid-event-dot{display:none}
.fc .fc-col-header-cell{background:var(--brown);padding:10px 0}
.fc .fc-col-header-cell-cushion,.fc .fc-daygrid-day-number{color:#3b2f2f;text-decoration:none;font-weight:600}
.event-time-bold{font-weight:900;color:#fff}
.event-title-normal{font-weight:400;color:#fff}

.schedule-tooltip{position:absolute;background:#fff;padding:12px 14px;border-radius:14px;box-shadow:0 8px 22px rgba(0,0,0,.18);font-size:13px;line-height:1.45;z-index:5000;pointer-events:none;max-width:260px;color:#3b2f2f}
.schedule-tooltip-title{font-weight:900;margin-bottom:4px}
.schedule-tooltip-muted{color:#666;font-size:12px;margin-top:4px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;justify-content:center;align-items:center;padding:18px;z-index:2000}
.overlay.show{display:flex}
.modal{width:min(780px,100%);background:var(--modalBg);border-radius:30px;box-shadow:var(--shadow);padding:18px 22px 24px;max-height:90vh;overflow:auto}
.mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.mtitle{font-size:34px;font-weight:900;line-height:1.1;letter-spacing:.2px;color:#3b2f2f}
.close{width:40px;height:40px;border-radius:8px;background:var(--danger);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:900;line-height:1;padding:0;border:0;cursor:pointer}
.divider{height:1px;background:#cfc7c2;margin:16px 0}
.grid{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.full{grid-column:1/-1}
.field{position:relative}
.detail-label{position:absolute;left:18px;top:8px;font-size:12px;font-weight:700;color:var(--muted);pointer-events:none;z-index:2;background:var(--inputBg);padding:0 6px;border-radius:8px}
.detail-box{width:100%;padding:28px 18px 16px;border-radius:26px;border:2px solid var(--inputBorder);font-size:15px;font-weight:500;background:var(--inputBg);color:#000;box-sizing:border-box;min-height:58px}
.description-box{min-height:110px;line-height:1.5}
.actions{margin-top:18px;display:flex;justify-content:center;gap:18px}
.btnDark{background:#000;color:#fff;border:0;font-weight:900;padding:14px 46px;border-radius:22px;cursor:pointer;font-size:16px;min-width:160px}
</style>

<script>
document.addEventListener("DOMContentLoaded", function(){
  const calendarEl = document.getElementById("calendar");
  const detailOverlay = document.getElementById("detailOverlay");
  const closeDetailBtn = document.getElementById("closeDetailBtn");
  const closeDetailBottomBtn = document.getElementById("closeDetailBottomBtn");
  let tooltipEl = null;

  function setDetailText(event){
    document.getElementById("detailTitle").textContent = event.extendedProps.schedule_title || event.title;
    document.getElementById("detailDate").textContent = event.extendedProps.date || "";
    document.getElementById("detailStartTime").textContent = event.extendedProps.start_time || "";
    document.getElementById("detailEndTime").textContent = event.extendedProps.end_time || "";
    document.getElementById("detailEmployees").textContent = event.extendedProps.assigned_employees || "No employees assigned";
    document.getElementById("detailDescription").textContent = event.extendedProps.description || "No description provided";
  }

  function formatEventTime(date){
    return date.toLocaleTimeString([], {
      hour:"numeric",
      minute:date.getMinutes() === 0 ? undefined : "2-digit",
      hour12:true
    }).replace(" ", "").toUpperCase();
  }

  function openDetailModal(event){
    hideTooltip();
    setDetailText(event);
    detailOverlay.classList.add("show");
  }

  function closeDetailModal(){
    detailOverlay.classList.remove("show");
  }

  function showTooltip(info){
    hideTooltip();
    const event = info.event;

    tooltipEl = document.createElement("div");
    tooltipEl.className = "schedule-tooltip";
    tooltipEl.innerHTML = `
      <div class="schedule-tooltip-title">${event.extendedProps.schedule_title || event.title}</div>
      <div>${event.extendedProps.date || ""}</div>
      <div>${event.extendedProps.start_time || ""} - ${event.extendedProps.end_time || ""}</div>
      <div class="schedule-tooltip-muted">${event.extendedProps.assigned_employees || "No employees assigned"}</div>
    `;

    document.body.appendChild(tooltipEl);
    moveTooltip(info);
  }

  function moveTooltip(info){
    if(!tooltipEl) return;

    const rect = info.el.getBoundingClientRect();
    let top = rect.top + window.scrollY - tooltipEl.offsetHeight - 8;
    let left = rect.left + window.scrollX;

    if(top < window.scrollY + 8) top = rect.bottom + window.scrollY + 8;
    if(left + tooltipEl.offsetWidth > window.scrollX + window.innerWidth) {
      left = window.scrollX + window.innerWidth - tooltipEl.offsetWidth - 12;
    }

    tooltipEl.style.top = top + "px";
    tooltipEl.style.left = left + "px";
  }

  function hideTooltip(){
    if(tooltipEl){
      tooltipEl.remove();
      tooltipEl = null;
    }
  }

  const calendar = new FullCalendar.Calendar(calendarEl, {
    initialView:"dayGridMonth",
    height:"auto",
    selectable:false,
    editable:false,
    headerToolbar:{left:"prev,next today",center:"title",right:"dayGridMonth,timeGridWeek,timeGridDay"},
    events:"{% url 'schedule_events' %}",
    eventContent:function(arg){
      const timeText = formatEventTime(arg.event.start);
      const title = arg.event.extendedProps.schedule_title || arg.event.title;

      return {
        html:`<span class="event-time-bold">${timeText}</span> <span class="event-title-normal">${title}</span>`
      };
    },
    eventClick:function(info){ openDetailModal(info.event); },
    eventMouseEnter:function(info){ showTooltip(info); },
    eventMouseLeave:function(){ hideTooltip(); }
  });

  calendar.render();

  closeDetailBtn.addEventListener("click", closeDetailModal);
  closeDetailBottomBtn.addEventListener("click", closeDetailModal);
  detailOverlay.addEventListener("click", e => { if(e.target === detailOverlay) closeDetailModal(); });
  document.addEventListener("keydown", e => {
    if(e.key === "Escape"){
      hideTooltip();
      closeDetailModal();
    }
  });
});
</script>
{% endblock %}
